              enum: [admin, member]
              description: Role of the invited user
              example: member
            expiresAt:
              type: string
              format: date-time
              description: When the invitation expires
              example: 2023-04-22T10:30:00Z

    Notification:
      type: object
      properties:
        _id:
          type: string
          description: Notification ID
          example: 60d21b4667d0d8992e610c85
        userId:
          type: string
          description: ID of the user who received the notification
          example: 60d21b4667d0d8992e610c83
        type:
          type: string
          enum: [task_created, deadline_approaching, task_completed, member_added, invitation_accepted]
          description: Type of notification
          example: task_created
        content:
          type: string
          description: Notification content
          example: You have been assigned a new task
        relatedEntityId:
          type: string
          description: ID of the related entity (e.g., task, flock)
          example: 60d21b4667d0d8992e610c87
        isRead:
          type: boolean
          description: Whether the notification has been read
          example: false
        createdAt:
          type: string
          format: date-time
          description: When the notification was created
          example: 2023-06-22T15:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: When the notification was last updated
          example: 2023-06-22T15:30:00Z
        expiresAt:
          type: string
          format: date-time
          description: When the notification expires
          example: 2023-07-22T15:30:00Z

  responses:
    UnreadCountResponse:
      description: Unread notification count
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              data:
                type: object
                properties:
                  count:
                    type: integer
                    example: 3
    MarkAllAsReadResponse:
      description: Mark all notifications as read response
      content:
        application/json:
          schema:
            type: object
            properties:
              success:
                type: boolean
                example: true
              message:
                type: string
                example: All notifications marked as read
              count:
                type: integer
                example: 5 