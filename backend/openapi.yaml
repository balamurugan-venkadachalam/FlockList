openapi: 3.0.3
info:
  title: TaskMaster API
  description: |
    API for managing tasks, families, flocks, and notifications in the TaskMaster application.
    This RESTful API provides comprehensive endpoints for user authentication, task management, 
    family/flock organization, and notification handling.
  version: 1.0.0
  contact:
    name: TaskMaster Team
servers:
  - url: /api
    description: API base path

tags:
  - name: Authentication
    description: User authentication and account management endpoints
  - name: Tasks
    description: Task creation, retrieval, updating, and deletion endpoints
  - name: Task Comments
    description: Endpoints for managing comments on tasks
  - name: Task Attachments
    description: Endpoints for managing file attachments on tasks
  - name: Task Dependencies
    description: Endpoints for managing task dependencies
  - name: Task History
    description: Endpoints for tracking task history and changes
  - name: Recurring Tasks
    description: Endpoints for managing recurring task patterns
  - name: Flocks
    description: Flock (team/group) management endpoints
  - name: Families
    description: Family management endpoints
  - name: Notifications
    description: Notification management endpoints

paths:
  /auth/register:
    post:
      tags:
        - Authentication
      summary: Register new user
      description: Creates a new user account with the provided information
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Email already in use
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /auth/login:
    post:
      tags:
        - Authentication
      summary: User login
      description: Authenticates a user with email and password, returning a JWT token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Authentication failed - invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /auth/logout:
    post:
      tags:
        - Authentication
      summary: User logout
      description: Invalidates the user's refresh token
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Logged out successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Logged out successfully
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Get current user
      description: Retrieves information about the currently authenticated user
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: User information retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/refresh-token:
    post:
      tags:
        - Authentication
      summary: Refresh authentication token
      description: Creates a new JWT token using the refresh token
      operationId: refreshToken
      responses:
        '200':
          description: Token refreshed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid refresh token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/google:
    post:
      tags:
        - Authentication
      summary: Google authentication
      description: Authenticates or registers a user via Google OAuth
      operationId: googleAuth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: The Google OAuth ID token
      responses:
        '200':
          description: Authentication successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Authentication failed - invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/verify-email:
    get:
      tags:
        - Authentication
      summary: Verify email address
      description: Verifies a user's email address using the token sent during registration
      operationId: verifyEmail
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: Email verification token
      responses:
        '200':
          description: Email verified successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Invalid verification token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Token not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /auth/resend-verification:
    post:
      tags:
        - Authentication
      summary: Resend verification email
      description: Resends the verification email to the user
      operationId: resendVerificationEmail
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
      responses:
        '200':
          description: Verification email sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Verification email resent successfully
        '400':
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: User not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks:
    post:
      tags:
        - Tasks
      summary: Create a new task
      description: Creates a new task with the specified details
      operationId: createTask
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskCreateRequest'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to create tasks in this flock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    get:
      tags:
        - Tasks
      summary: Get tasks
      description: |
        Retrieves tasks with optional filtering by status, priority, category, and other criteria.
        Results can be sorted and paginated.
      operationId: getTasks
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          description: Filter tasks by status (pending, in_progress, completed, cancelled)
          required: false
          schema:
            type: string
            enum: [pending, in_progress, completed, cancelled]
        - name: priority
          in: query
          description: Filter tasks by priority level
          required: false
          schema:
            type: string
            enum: [low, medium, high]
        - name: category
          in: query
          description: Filter tasks by category
          required: false
          schema:
            type: string
            enum: [chore, homework, activity, other]
        - name: flock
          in: query
          description: Filter tasks by flock ID
          required: false
          schema:
            type: string
        - name: assignee
          in: query
          description: Filter tasks by assignee user ID
          required: false
          schema:
            type: string
        - name: dueBefore
          in: query
          description: Filter tasks due before this date (ISO format)
          required: false
          schema:
            type: string
            format: date-time
        - name: dueAfter
          in: query
          description: Filter tasks due after this date (ISO format)
          required: false
          schema:
            type: string
            format: date-time
        - name: createdBy
          in: query
          description: Filter tasks by creator user ID
          required: false
          schema:
            type: string
        - name: sortBy
          in: query
          description: Field to sort by
          required: false
          schema:
            type: string
            enum: [createdAt, dueDate, priority, status]
            default: createdAt
        - name: sortOrder
          in: query
          description: Sort order (ascending or descending)
          required: false
          schema:
            type: string
            enum: [asc, desc]
            default: desc
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: List of tasks matching the criteria
          content:
            application/json:
              schema:
                type: object
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /tasks/{taskId}:
    get:
      tags:
        - Tasks
      summary: Get task by ID
      description: Retrieves detailed information for a specific task
      operationId: getTaskById
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          description: ID of the task to retrieve
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to access this task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    put:
      tags:
        - Tasks
      summary: Update task
      description: Updates details of an existing task
      operationId: updateTask
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          description: ID of the task to update
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskUpdateRequest'
      responses:
        '200':
          description: Task updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to update this task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags:
        - Tasks
      summary: Delete task
      description: Permanently deletes a task
      operationId: deleteTask
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          description: ID of the task to delete
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Task deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Task deleted successfully
                  taskId:
                    type: string
                    example: 5f8d0c1b9d3e2a1b3c4d5e6f
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to delete this task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  
  /tasks/{taskId}/status:
    patch:
      tags:
        - Tasks
      summary: Update task status
      description: Updates only the status of a task (e.g., mark as complete)
      operationId: updateTaskStatus
      security:
        - bearerAuth: []
      parameters:
        - name: taskId
          in: path
          description: ID of the task to update
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum: [pending, in_progress, completed, cancelled]
                  description: The new status for the task
      responses:
        '200':
          description: Task status updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '400':
          description: Invalid status value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to update this task
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Task not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notifications:
    get:
      tags:
        - Notifications
      summary: Get user notifications
      description: Retrieves notifications for the current user with pagination
      operationId: getNotifications
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          description: Page number for pagination
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: limit
          in: query
          description: Number of notifications per page
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: read
          in: query
          description: Filter by read status
          required: false
          schema:
            type: boolean
      responses:
        '200':
          description: Notifications retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  notifications:
                    type: array
                    items:
                      $ref: '#/components/schemas/Notification'
                  pagination:
                    $ref: '#/components/schemas/Pagination'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    delete:
      tags:
        - Notifications
      summary: Delete all notifications
      description: Deletes all notifications for the current user
      operationId: deleteAllNotifications
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: All notifications deleted successfully
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notifications/unread-count:
    get:
      tags:
        - Notifications
      summary: Get unread notification count
      description: Returns the count of unread notifications for the current user
      operationId: getUnreadCount
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unread count retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  count:
                    type: integer
                    description: Number of unread notifications
                    example: 5
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notifications/mark-all-read:
    put:
      tags:
        - Notifications
      summary: Mark all notifications as read
      description: Marks all notifications for the current user as read
      operationId: markAllAsRead
      security:
        - bearerAuth: []
      responses:
        '200':
          description: All notifications marked as read
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: All notifications marked as read
                  count:
                    type: integer
                    description: Number of notifications updated
                    example: 10
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notifications/{id}/read:
    put:
      tags:
        - Notifications
      summary: Mark notification as read
      description: Marks a specific notification as read
      operationId: markAsRead
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the notification to mark as read
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Notification'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to modify this notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /notifications/{id}:
    delete:
      tags:
        - Notifications
      summary: Delete notification
      description: Deletes a specific notification
      operationId: deleteNotification
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the notification to delete
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Notification deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Notification deleted successfully
                  notificationId:
                    type: string
                    example: 5f8d0c1b9d3e2a1b3c4d5e6f
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to delete this notification
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Notification not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flocks:
    post:
      tags:
        - Flocks
      summary: Create flock
      description: Creates a new flock (team/group)
      operationId: createFlock
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: Name of the flock
                  example: "Family Tasks"
                  maxLength: 50
      responses:
        '201':
          description: Flock created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flock'
        '400':
          description: Invalid input or validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    
    get:
      tags:
        - Flocks
      summary: Get user flocks
      description: Retrieves all flocks that the current user is a member of
      operationId: getFlocks
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Flocks retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Flock'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flocks/invitations:
    get:
      tags:
        - Flocks
      summary: Get user invitations
      description: Retrieves all pending flock invitations for the current user
      operationId: getUserInvitations
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invitations retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FlockInvitation'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flocks/accept-invitation:
    post:
      tags:
        - Flocks
      summary: Accept flock invitation
      description: Accepts an invitation to join a flock
      operationId: acceptInvitation
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - token
              properties:
                token:
                  type: string
                  description: Invitation token
      responses:
        '200':
          description: Invitation accepted successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flock'
        '400':
          description: Invalid token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Invitation not found or expired
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flocks/{id}:
    get:
      tags:
        - Flocks
      summary: Get flock by ID
      description: Retrieves detailed information about a specific flock
      operationId: getFlockById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the flock to retrieve
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Flock retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flock'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to view this flock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Flock not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flocks/{id}/invite:
    post:
      tags:
        - Flocks
      summary: Invite member to flock
      description: Sends an invitation to a user to join a flock
      operationId: inviteMember
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the flock to invite to
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - role
              properties:
                email:
                  type: string
                  format: email
                  description: Email of the user to invite
                role:
                  type: string
                  enum: [admin, member]
                  description: Role to assign to the invited user
      responses:
        '200':
          description: Invitation sent successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invitation sent successfully
                  invitation:
                    $ref: '#/components/schemas/FlockInvitation'
        '400':
          description: Invalid input, user already a member, or invitation already sent
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to invite members to this flock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Flock not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flocks/{id}/members/{userId}:
    delete:
      tags:
        - Flocks
      summary: Remove member from flock
      description: Removes a member from a flock
      operationId: removeMember
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the flock to remove member from
          required: true
          schema:
            type: string
        - name: userId
          in: path
          description: ID of the user to remove
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Member removed successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Member removed successfully
                  flockId:
                    type: string
                    example: 5f8d0c1b9d3e2a1b3c4d5e6f
                  userId:
                    type: string
                    example: 5f8d0c1b9d3e2a1b3c4d5e6f
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to remove members from this flock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Flock or member not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /flocks/{id}/invitations/{email}:
    delete:
      tags:
        - Flocks
      summary: Cancel invitation
      description: Cancels a pending invitation to join a flock
      operationId: cancelInvitation
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          description: ID of the flock
          required: true
          schema:
            type: string
        - name: email
          in: path
          description: Email address of the invited user
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation cancelled successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Invitation cancelled successfully
                  flockId:
                    type: string
                    example: 5f8d0c1b9d3e2a1b3c4d5e6f
                  email:
                    type: string
                    example: user@example.com
        '401':
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not authorized to cancel invitations for this flock
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Flock or invitation not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Enter JWT token
  
  schemas:
    RegisterRequest:
      type: object
      required:
        - email
        - password
        - firstName
        - lastName
        - role
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        password:
          type: string
          format: password
          minLength: 8
          description: User's password
          example: password123
        firstName:
          type: string
          description: User's first name
          example: John
        lastName:
          type: string
          description: User's last name
          example: Doe
        role:
          type: string
          enum: [admin, member]
          description: User's role
          example: admin

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        password:
          type: string
          format: password
          description: User's password
          example: password123

    AuthResponse:
      type: object
      properties:
        message:
          type: string
          example: Login successful
        user:
          $ref: '#/components/schemas/User'
        token:
          type: string
          description: JWT access token
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        requireEmailVerification:
          type: boolean
          description: Indicates if email verification is required
          example: true

    UserResponse:
      type: object
      properties:
        message:
          type: string
          example: User retrieved successfully
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        _id:
          type: string
          description: User ID
          example: 5f8d0d55b54764421b724a04
        email:
          type: string
          format: email
          description: User's email address
          example: user@example.com
        firstName:
          type: string
          description: User's first name
          example: John
        lastName:
          type: string
          description: User's last name
          example: Doe
        role:
          type: string
          enum: [admin, member]
          description: User's role
          example: admin
        createdAt:
          type: string
          format: date-time
          description: User creation timestamp
          example: 2023-04-15T10:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: User last update timestamp
          example: 2023-04-15T10:30:00Z

    TaskCreateRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          maxLength: 100
          description: Task title
          example: Complete homework
        description:
          type: string
          maxLength: 500
          description: Task description
          example: Finish math assignment
        priority:
          type: string
          enum: [low, medium, high]
          description: Task priority
          example: medium
        dueDate:
          type: string
          format: date-time
          description: Task due date
          example: 2023-04-20T23:59:59Z
        status:
          type: string
          enum: [todo, in_progress, completed]
          description: Task status
          example: todo

    TaskUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 100
          description: Task title
          example: Complete homework
        description:
          type: string
          maxLength: 500
          description: Task description
          example: Finish math assignment
        priority:
          type: string
          enum: [low, medium, high]
          description: Task priority
          example: medium
        dueDate:
          type: string
          format: date-time
          description: Task due date
          example: 2023-04-20T23:59:59Z
        status:
          type: string
          enum: [todo, in_progress, completed]
          description: Task status
          example: todo

    Task:
      type: object
      properties:
        _id:
          type: string
          description: Task ID
          example: 5f8d0d55b54764421b724a04
        title:
          type: string
          description: Task title
          example: Complete homework
        description:
          type: string
          description: Task description
          example: Finish math assignment
        status:
          type: string
          enum: [todo, in_progress, completed]
          description: Task status
          example: todo
        priority:
          type: string
          enum: [low, medium, high]
          description: Task priority
          example: medium
        dueDate:
          type: string
          format: date-time
          description: Task due date
          example: 2023-04-20T23:59:59Z
        userId:
          type: string
          description: ID of the user who owns the task
          example: 5f8d0d55b54764421b724a04
        createdAt:
          type: string
          format: date-time
          description: Task creation timestamp
          example: 2023-04-15T10:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: Task last update timestamp
          example: 2023-04-15T10:30:00Z

    Error:
      type: object
      properties:
        message:
          type: string
          description: Error message
          example: Invalid credentials
        errors:
          type: array
          items:
            type: string
          description: Detailed error messages
          example: ["Email is required", "Password must be at least 8 characters long"]

    CreateFlockRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Name of the flock
          example: "Family Tasks"
          maxLength: 50

    InviteMemberRequest:
      type: object
      required:
        - email
        - role
      properties:
        email:
          type: string
          format: email
          description: Email of the user to invite
          example: user@example.com
        role:
          type: string
          enum: [admin, member]
          description: Role of the user in the flock
          example: member

    Flock:
      type: object
      properties:
        _id:
          type: string
          description: Flock ID
          example: 5f8d0d55b54764421b724a04
        name:
          type: string
          description: Name of the flock
          example: The Smiths
        members:
          type: array
          items:
            type: object
            properties:
              user:
                $ref: '#/components/schemas/User'
              role:
                type: string
                enum: [admin, member]
                description: Role of the user in the flock
                example: admin
              joinedAt:
                type: string
                format: date-time
                description: When the user joined the flock
                example: 2023-04-15T10:30:00Z
        pendingInvitations:
          type: array
          items:
            type: object
            properties:
              email:
                type: string
                format: email
                description: Email of the invited user
                example: invited@example.com
              role:
                type: string
                enum: [admin, member]
                description: Role of the invited user
                example: member
              token:
                type: string
                description: Invitation token
                example: a1b2c3d4e5f6
              expiresAt:
                type: string
                format: date-time
                description: When the invitation expires
                example: 2023-04-22T10:30:00Z
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
          description: Flock creation timestamp
          example: 2023-04-15T10:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: Flock last update timestamp
          example: 2023-04-15T10:30:00Z

    FlockResponse:
      type: object
      properties:
        message:
          type: string
          example: Flock created successfully
        flock:
          $ref: '#/components/schemas/Flock'

    InvitationResponse:
      type: object
      properties:
        message:
          type: string
          example: Invitation sent successfully
        invitation:
          type: object
          properties:
            email:
              type: string
              format: email
              description: Email of the invited user
              example: invited@example.com
            role:
              type: string
              enum: [admin, member]
              description: Role of the invited user
              example: member
            expiresAt:
              type: string
              format: date-time
              description: When the invitation expires
              example: 2023-04-22T10:30:00Z

    Notification:
      type: object
      properties:
        _id:
          type: string
          description: Notification ID
          example: 60d21b4667d0d8992e610c85
        userId:
          type: string
          description: ID of the user who received the notification
          example: 60d21b4667d0d8992e610c83
        type:
          type: string
          enum: [task_created, deadline_approaching, task_completed, member_added, invitation_accepted]
          description: Type of notification
          example: task_created
        content:
          type: string
          description: Notification content
          example: You have been assigned a new task
        relatedEntityId:
          type: string
          description: ID of the related entity (e.g., task, flock)
          example: 60d21b4667d0d8992e610c87
        isRead:
          type: boolean
          description: Whether the notification has been read
          example: false
        createdAt:
          type: string
          format: date-time
          description: When the notification was created
          example: 2023-06-22T15:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: When the notification was last updated
          example: 2023-06-22T15:30:00Z
        expiresAt:
          type: string
          format: date-time
          description: When the notification expires
          example: 2023-07-22T15:30:00Z

    TaskComment:
      type: object
      properties:
        _id:
          type: string
          description: Comment ID
          example: 5f8d0c1b9d3e2a1b3c4d5e6f
        content:
          type: string
          description: Comment content
          example: This is a task comment
        userId:
          type: string
          description: ID of the user who created the comment
          example: 5f8d0d55b54764421b724a04
        taskId:
          type: string
          description: ID of the task the comment belongs to
          example: 5f8d0d55b54764421b724a04
        createdAt:
          type: string
          format: date-time
          description: When the comment was created
          example: 2023-04-15T10:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: When the comment was last updated
          example: 2023-04-15T10:30:00Z

    TaskAttachment:
      type: object
      properties:
        _id:
          type: string
          description: Attachment ID
          example: 5f8d0c1b9d3e2a1b3c4d5e6f
        filename:
          type: string
          description: Attachment filename
          example: homework.pdf
        description:
          type: string
          description: Attachment description
          example: Math homework
        url:
          type: string
          description: Attachment URL
          example: https://example.com/homework.pdf
        size:
          type: integer
          description: Attachment size in bytes
          example: 123456
        userId:
          type: string
          description: ID of the user who uploaded the attachment
          example: 5f8d0d55b54764421b724a04
        taskId:
          type: string
          description: ID of the task the attachment belongs to
          example: 5f8d0d55b54764421b724a04
        createdAt:
          type: string
          format: date-time
          description: When the attachment was created
          example: 2023-04-15T10:30:00Z
        updatedAt:
          type: string
          format: date-time
          description: When the attachment was last updated
          example: 2023-04-15T10:30:00Z

    TaskHistory:
      type: object
      properties:
        _id:
          type: string
          description: Task history ID
          example: 5f8d0c1b9d3e2a1b3c4d5e6f
        taskId:
          type: string
          description: ID of the task
          example: 5f8d0d55b54764421b724a04
        changeType:
          type: string
          enum: [created, updated, deleted]
          description: Type of change
          example: updated
        changes:
          type: object
          description: Details of the change
          properties:
            field:
              type: string
              description: Name of the field that was changed
              example: title
            oldValue:
              type: string
              description: Previous value of the field
              example: Complete homework
            newValue:
              type: string
              description: New value of the field
              example: Finish math assignment
        userId:
          type: string
          description: ID of the user who made the change
          example: 5f8d0d55b54764421b724a04
        timestamp:
          type: string
          format: date-time
          description: Timestamp of the change
          example: 2023-04-15T10:30:00Z

    RecurringTaskCreateRequest:
