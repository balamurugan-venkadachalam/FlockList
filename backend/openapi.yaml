    Flock:
      type: object
      properties:
        _id:
          type: string
          description: Flock ID
          example: 5f8d0d55b54764421b724a04
        name:
          type: string
          description: Name of the flock
          example: The Smiths
        members:
          type: array
          items:
            type: object
            properties:
              user:
                $ref: '#/components/schemas/User'
              role:
                type: string
                enum: [admin, member]
                description: Role of the user in the flock
                example: admin
              joinedAt:
                type: string
                format: date-time
                description: When the user joined the flock
                example: 2023-04-15T10:30:00Z
        pendingInvitations:
          type: array
          items:
            type: object
            properties:
              email:
                type: string
                format: email
                description: Email of the invited user
                example: invited@example.com
              role:
                type: string
                enum: [admin, member]
                description: Role of the invited user
                example: member
              token:
                type: string
                description: Invitation token
                example: a1b2c3d4e5f6
              expiresAt:
                type: string
                format: date-time
                description: When the invitation expires
                example: 2023-04-22T10:30:00Z
        createdBy:
          $ref: '#/components/schemas/User'
        createdAt:
          type: string
          format: date-time
          description: Flock creation timestamp
          example: 2023-04-15T10:30:00Z
        updatedAt:
          type: string
          format: date-time
